# =============================================================
# docker-compose.yml  –  Backend + Postgres + Redis + Frontend (build local)
#
# Uso (desde backend/):
#   cp .env.example .env          # una sola vez; completar POSTGRES_PASSWORD
#   docker compose up --build
# =============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: becas_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-becas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (definilo en backend/.env)}
      POSTGRES_DB: ${POSTGRES_DB:-becas_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-becas} -d ${POSTGRES_DB:-becas_db}' ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: becas_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # Única definición de build: la imagen se construye una sola vez
    # y el worker la reutiliza por tag.
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      cache_from:
        - becas_backend:local
    image: becas_backend:local
    container_name: becas_app
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-becas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-becas_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
    volumes:
      - uploads_data:/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Sin `build`: reutiliza la imagen construida por `app`
    image: becas_backend:local
    pull_policy: never
    container_name: becas_worker
    command: [ "node", "dist/worker-main.js" ]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-becas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-becas_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
    volumes:
      - uploads_data:/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: becas_frontend
    ports:
      - '8080:80'
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  uploads_data:
