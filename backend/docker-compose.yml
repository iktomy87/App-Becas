services:
  postgres:
    image: postgres:16-alpine
    container_name: becas_postgres
    environment:
      POSTGRES_USER: becas
      POSTGRES_PASSWORD: becas_dev
      POSTGRES_DB: becas_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U becas -d becas_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: becas_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: becas_app
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://becas:becas_dev@postgres:5432/becas_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
    volumes:
      - uploads_data:/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: becas_worker
    command: ["node", "dist/worker-main.js"]
    environment:
      DATABASE_URL: postgresql://becas:becas_dev@postgres:5432/becas_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
    volumes:
      - uploads_data:/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: becas_frontend
    ports:
      - '8080:80'
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  uploads_data:
